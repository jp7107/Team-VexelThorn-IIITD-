[project]
name = "kisan-mitra-backend"
version = "0.1.0"
description = "Kisan Mitra API — FastAPI backend for the Agriculture & Rural Development platform"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "pyjwt",
    "argon2-cffi",
    "email-validator",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = [
    "S101",  # asserts are the test framework
    "E501",  # formatter owns line length; long strings are allowed
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # test fixtures use fake secrets and passwords

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: requires a running PostgreSQL test database"]
